apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.gateway.port }}
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: agent-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-worker
spec:
  selector:
    app: agent-worker
  ports:
    - name: health
      port: 9090
      targetPort: 9090
  type: ClusterIP
